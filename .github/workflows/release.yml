name: "publish"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  # Formato que exige actions/setup-java (sufijo .0.LTS)
  SETUP_JAVA_VERSION: "25.0.3+9.0.LTS"
  JAR_URL: "https://github.com/UBUMonitor/ubumonitor-analytics-api/releases/download/v0.0.5/ubumonitoranalytics-0.0.5.jar"

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # Arm (M1+)
            args: "--target aarch64-apple-darwin"
          - platform: "macos-15-intel" # Intel: runner x64 nativo, así jlink genera un runtime x64 sin cruzar
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "pnpm"

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || matrix.platform == 'macos-15-intel' && 'x86_64-apple-darwin' || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libfuse2

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Temurin JDK 25 (para jdeps y jlink)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.SETUP_JAVA_VERSION }}

      - name: Download JAR
        shell: bash
        run: |
          set -e
          mkdir -p src-tauri/resources
          curl -L --fail -o src-tauri/resources/app.jar "${{ env.JAR_URL }}"

      - name: Build runtime with jlink
        shell: bash
        run: |
          set -euo pipefail

          WORK="jlink-work"
          OUT="src-tauri/resources/jre"
          rm -rf "$WORK" "$OUT"
          mkdir -p "$WORK"
          cp src-tauri/resources/app.jar "$WORK/app.jar"

          # 1. Extraer el fat jar (app.jar + lib/*.jar)
          java -Djarmode=tools -jar "$WORK/app.jar" extract --destination "$WORK/extracted"

          # 2. Calcular módulos con jdeps
          MODS=$(jdeps --ignore-missing-deps -q --recursive --multi-release 25 \
            --print-module-deps \
            --class-path "$WORK/extracted/lib/*" \
            "$WORK/extracted/app.jar")
          if [ -z "$MODS" ]; then
            echo "jdeps no devolvió módulos"
            exit 1
          fi
          echo "Módulos detectados por jdeps: $MODS"

          # 3. Extras que jdeps no detecta (solo los que existan en este JDK)
          AVAILABLE=$(java --list-modules)
          EXTRAS=""
          for m in java.naming java.sql java.management java.desktop java.instrument jdk.unsupported jdk.crypto.ec; do
            if grep -q "^$m@" <<< "$AVAILABLE"; then
              EXTRAS="$EXTRAS,$m"
            fi
          done
          echo "Extras añadidos: $EXTRAS"

          # 4. jlink (el JDK del runner es de la plataforma destino)
          jlink \
            --add-modules "${MODS}${EXTRAS}" \
            --strip-debug \
            --no-header-files \
            --no-man-pages \
            --compress zip-6 \
            --output "$OUT"

          # 5. Informe y limpieza
          echo "Runtime generado:"
          du -sh "$OUT"
          "$OUT/bin/java" --list-modules
          rm -rf "$WORK"

      - name: Set LD_LIBRARY_PATH for JRE (linuxdeploy dependency resolution)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/src-tauri/resources/jre/lib/server:$GITHUB_WORKSPACE/src-tauri/resources/jre/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: "UBUMonitor Analytics v__VERSION__"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
