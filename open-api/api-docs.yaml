  /api/courses/{courseId}/activitycompletion/info:
    get:
      tags:
        - CourseActivityCompletion
      summary: Get course activity completion information
      description: Retrieves the activity completion information for a course.
      operationId: getCourseActivityCompletionInfo
      parameters:
        - name: courseId
          in: path
          description: The unique identifier of the course for which to retrieve activity
            completion information.
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Get course activity completion information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseActivityCompletionResponse"
        "401":
          description: Unauthorized - token missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []
