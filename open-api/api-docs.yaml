    ActivityCompletion:
      type: object
      description: An activity of the course and the completion status of each user
        in it.
      properties:
        moduleId:
          type: integer
          format: int64
          description: The unique identifier of the course module.
        users:
          type: array
          description: Completion status of each enrolled user for this activity.
          items:
            $ref: "#/components/schemas/UserActivityCompletion"
      required:
        - moduleId
        - users
    CourseActivityCompletionResponse:
      type: object
      description: "Completion status of a course, grouped by activity. Each activity\
        \ lists the status of every enrolled user."
      properties:
        activities:
          type: array
          description: Course activities that have completion tracking enabled.
          items:
            $ref: "#/components/schemas/ActivityCompletion"
      required:
        - activities
    UserActivityCompletion:
      type: object
      description: Completion status of one user for one activity.
      properties:
        userId:
          type: integer
          format: int64
          description: The unique identifier of the user.
        state:
          type: string
          description: "Completion state of the activity for the user. PASS means
            completed with a passing grade; FAIL means completed with a failing grade. "
          enum:
            - INCOMPLETE
            - COMPLETE
            - PASS
            - FAIL
        timeCompleted:
          type: integer
          format: int64
          description: Unix timestamp in seconds when the activity was completed.
            Null if it has not been completed.
        tracking:
          type: string
          description: "How completion is tracked for this activity. NONE means completion
            is not tracked; MANUAL means the user marks the activity as done; AUTOMATIC
            means it is completed automatically when the configured conditions are
            met. "
          enum:
            - NONE
            - MANUAL
            - AUTOMATIC
        overrideBy:
          type: integer
          format: int64
          description: Identifier of the user who manually overrode the status.
        valueUsed:
          type: boolean
          description: "Whether the completion status of this activity is used by\
            \ another activity, for example in an access restriction that requires\
            \ it to be completed."
        isTrackedUser:
          type: boolean
          description: "Whether the user is tracked for completion, meaning their\
            \ progress counts towards the activity. Depends on the user's role in\
            \ the course."
        userVisible:
          type: boolean
          description: "Whether the activity is visible to this specific user, taking\
            \ into account availability restrictions and group settings."
      required:
        - isTrackedUser
        - state
        - tracking
        - userId
        - userVisible
        - valueUsed
