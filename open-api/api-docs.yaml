openapi: 3.1.0
info:
  title: UBUMonitor-Analytics
  description: API documentation for UBUMonitor Analytics
  version: 1.0.0
servers:
  - url: http://localhost:9090/api
    description: Local development server
security:
  - bearerAuth: []
tags:
  - name: CourseLogs
    description: the CourseLogs API
  - name: CourseEnrollments
    description: the CourseEnrollments API
  - name: Sites
    description: the Sites API
  - name: CourseContent
    description: the CourseContent API
  - name: CourseGrades
    description: the CourseGrades API
  - name: Databases
    description: the Databases API
  - name: System
    description: the System API
  - name: Health
    description: the Health API
  - name: Auth
    description: the Auth API
  - name: CourseActivityCompletion
    description: the CourseActivityCompletion API
  - name: UserEnrollments
    description: the UserEnrollments API
  - name: Users
    description: the Users API
paths:
  /api/sites/sync:
    post:
      tags:
        - Sites
      summary: Synchronize site information
      description: "Synchronize site information from the Moodle instance. This endpoint\
        \ retrieves basic information about the Moodle site, such as the site name,\
        \ version, and other relevant details. This information can be used to ensure\
        \ that the integration is properly connected to the correct Moodle instance\
        \ and to gather necessary metadata for further interactions with the Moodle\
        \ API."
      operationId: syncSiteInfo
      responses:
        "200":
          description: Site information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteInfoResponseDto"
        "401":
          description: Unauthorized - token missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []
  /api/public/system/shutdown:
    post:
      tags:
        - System
      summary: Shutdown the server
      description: Shuts down the server gracefully.
      operationId: shutdown
      responses:
        "202":
          description: The server is shutting down.
        "503":
          description: The backend is not yet ready.
      security:
        - bearerAuth: []
  /api/public/auth/sso:
    post:
      tags:
        - Auth
      summary: Authenticate with an SSO launch credential
      description: "Receives a Moodle site URL, an SSO launch credential, and the\
        \ database encryption key. Returns an opaque Bearer session token for subsequent\
        \ authenticated requests. "
      operationId: authSSO
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthSSORequestDto"
        required: true
      responses:
        "200":
          description: Session token retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponseDto"
        "401":
          description: Unauthorized - token missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/public/auth/offline:
    post:
      tags:
        - Auth
      summary: Create an offline application session
      description: "Receives the Moodle site URL, username, and database encryption\
        \ key. Returns an opaque Bearer session token for an offline session. "
      operationId: authOffline
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthOfflineRequestDto"
        required: true
      responses:
        "200":
          description: Session token retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponseDto"
        "401":
          description: Unauthorized - token missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/public/auth/credentials:
    post:
      tags:
        - Auth
      summary: Authenticate with Moodle credentials
      description: "Receives a Moodle site URL, username, password, and database encryption\
        \ key. Returns an opaque Bearer session token for subsequent authenticated\
        \ requests. "
      operationId: authLogin
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginRequestDto"
        required: true
      responses:
        "200":
          description: Session token retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponseDto"
        "401":
          description: Unauthorized - token missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/enrollments/sync:
    post:
      tags:
        - UserEnrollments
      summary: Synchronize the current user's enrollments
      description: Retrieves the current user's latest course enrollments from Moodle
        and updates the local tenant database.
      operationId: syncUserEnrollments
      responses:
        "200":
          description: Successful synchronization of enrollments. The response includes
            the updated enrollment information for the user's courses.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentsResponseDto"
        "401":
          description: Unauthorized - token missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []
  /api/courses/{courseId}/logs/sync:
    post:
      tags:
        - CourseLogs
      summary: Sync Moodle logs CSV
      operationId: syncCourseLogs
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Sync completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseLogsResponseDto"
        "401":
          description: Unauthorized - token missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []
  /api/courses/{courseId}/logs/statistics:
    post:
      tags:
        - CourseLogs
      summary: Get course log statistics
      description: Get aggregated course log statistics
      operationId: getCourseLogsStatistics
      parameters:
        - name: courseId
          in: path
          description: Course identifier
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseLogsStatisticsRequestDto"
        required: true
      responses:
        "200":
          description: Logs retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseLogsStatisticsResponseDto"
        "401":
          description: Unauthorized - token missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []
  /api/courses/{courseId}/logs/list:
    post:
      tags:
        - CourseLogs
      summary: Get course logs with filters
      description: "Retrieves logs for a specific course with optional filtering by
        date range and selectable log columns. "
      operationId: getCourseLogsList
      parameters:
        - name: courseId
          in: path
          description: Course identifier
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseLogsListRequestDto"
        required: true
      responses:
        "200":
          description: Logs retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseLogsListResponseDto"
        "401":
          description: Unauthorized - token missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []
  /api/courses/{courseId}/logs/info:
    post:
      tags:
        - CourseLogs
      summary: Get course logs with filters
      description: "Retrieves logs for a specific course with optional filtering by
        date range and selectable log columns. "
      operationId: getCourseLogsInfo
      parameters:
        - name: courseId
          in: path
          description: Course identifier
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Logs retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseLogsResponseDto"
        "401":
          description: Unauthorized - token missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []
  /api/courses/{courseId}/logs/import:
    post:
      tags:
        - CourseLogs
      summary: Import Moodle logs CSV
      operationId: importCourseLogs
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                logFile:
                  type: string
                  format: binary
              required:
                - logFile
      responses:
        "200":
          description: Import completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseLogsResponseDto"
        "401":
          description: Unauthorized - token missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []
  /api/courses/{courseId}/grades/sync:
    post:
      tags:
        - CourseGrades
      summary: Synchronize course grades
      description: Retrieves the latest enrollment data for users in the specified
        course and updates the local tenant database.
      operationId: syncCourseGrades
      parameters:
        - name: courseId
          in: path
          description: The unique identifier of the course for which to synchronize
            grades.
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Successful synchronization of grades. The response includes
            the updated enrollment information for the user's courses.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseGradeItemsResponseDto"
        "401":
          description: Unauthorized - token missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []
  /api/courses/{courseId}/enrollments/sync:
    post:
      tags:
        - CourseEnrollments
      summary: Synchronize course enrollments
      description: Retrieves the latest enrollment data for users in the specified
        course and updates the local tenant database.
      operationId: syncCourseUsersEnrollments
      parameters:
        - name: courseId
          in: path
          description: The unique identifier of the course for which to synchronize
            enrollments.
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Successful synchronization of enrollments. The response includes
            the updated enrollment information for the user's courses.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseEnrollmentsResponseDto"
        "401":
          description: Unauthorized - token missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []
  /api/courses/{courseId}/content/sync:
    post:
      tags:
        - CourseContent
      summary: Synchronize course content
      description: Retrieves the latest sections and modules for the specified course
        from Moodle and stores them in the local tenant database.
      operationId: syncCourseContent
      parameters:
        - name: courseId
          in: path
          description: The unique identifier of the course for which to synchronize
            enrollments.
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Successful synchronization of enrollments. The response includes
            the updated enrollment information for the user's courses.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseContentResponseDto"
        "401":
          description: Unauthorized - token missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []
  /api/courses/{courseId}/activitycompletion/sync:
    post:
      tags:
        - CourseActivityCompletion
      summary: Synchronize course activity completion information
      description: Retrieves the latest activity completion information for the specified
        course from Moodle and stores it in the local tenant database.
      operationId: syncCourseActivityCompletion
      parameters:
        - name: courseId
          in: path
          description: The unique identifier of the course for which to synchronize
            activity completion information.
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Successful synchronization of activity completion information.
            The response includes the updated activity completion information for
            the user's courses.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseActivityCompletionResponse"
        "401":
          description: Unauthorized - token missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []
  /api/auth/logout:
    post:
      tags:
        - Auth
      summary: Logout session
      description: Logout session. The token must be included in the Authorization
        header as a Bearer token.
      operationId: authLogout
      responses:
        "204":
          description: Logout successful. No content is returned.
        "401":
          description: Unauthorized - token missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []
  /api/users/me/info:
    get:
      tags:
        - Users
      summary: Get site and current-user information
      description: Retrieves the authenticated user's information.
      operationId: getCurrentUserInfo
      responses:
        "200":
          description: User information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserInfoResponseDto"
        "401":
          description: Unauthorized - token missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []
  /api/users/images/document:
    get:
      tags:
        - Users
      summary: Get users Word document with enrollment images
      description: Retrieves the enrollment images for users
      operationId: getUsersEnrollmentImagesDocument
      parameters:
        - name: userIds
          in: query
          description: "List of user IDs to filter the results. If provided, only the\
            \ specified users will have their grades included in the response."
          required: true
          schema:
            type: array
            items:
              type: integer
              format: int64
            maxItems: 2147483647
            minItems: 1
        - name: defaultImageUri
          in: query
          description: The path to the default image file to use.
          required: false
          schema:
            type: string
            format: uri
        - name: useDefaultPhoto
          in: query
          description: Whether to use the default photo.
          required: false
          schema:
            type: boolean
        - name: headerText
          in: query
          description: The text to include in the header of the document.
          required: false
          schema:
            type: string
            default: UBUMonitor Analytics
        - name: fileName
          in: query
          description: The name of the file to be generated.
          required: false
          schema:
            type: string
            default: enrollment_images.docx
      responses:
        "200":
          description: Word document containing the enrollment images for users enrolled
            in the specified course.
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                type: string
                format: binary
        "401":
          description: Unauthorized - token missing or invalid
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []
  /api/sites/info:
    get:
      tags:
        - Sites
      summary: Get site and current-user information
      description: Retrieves the Moodle site information and the authenticated user's
        information.
      operationId: getSiteInfo
      responses:
        "200":
          description: Site information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteInfoResponseDto"
        "401":
          description: Unauthorized - token missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []
  /api/public/users/{userId}/images/profile:
    get:
      tags:
        - Users
      summary: Get user profile image
      description: Retrieves a user's Moodle profile image and supports conditional
        requests with an ETag.
      operationId: getUserImagesProfile
      parameters:
        - name: userId
          in: path
          description: Moodle user identifier.
          required: true
          schema:
            type: integer
            format: int64
        - name: host
          in: query
          description: Moodle site URL.
          required: true
          schema:
            type: string
            format: uri
        - name: username
          in: query
          description: Moodle username.
          required: true
          schema:
            type: string
        - name: If-None-Match
          in: header
          description: Entity tag used to check whether the image has changed.
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Image of the user
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            image/bmp:
              schema:
                type: string
                format: binary
            image/tiff:
              schema:
                type: string
                format: binary
        "304":
          description: Not Modified
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            image/bmp:
              schema:
                type: string
                format: binary
            image/tiff:
              schema:
                type: string
                format: binary
  /api/public/system/health:
    get:
      tags:
        - Health
      summary: Check service health
      description: Checks the health status of the service.
      operationId: checkHealth
      responses:
        "204":
          description: The service is healthy and operational.
        "503":
          description: The backend is not yet ready.
      security:
        - bearerAuth: []
  /api/public/system/databases/info:
    get:
      tags:
        - Databases
      summary: List all databases
      description: Retrieves a list of all available databases.
      operationId: listDatabases
      responses:
        "200":
          description: All available databases.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabasesInfoResponseDto"
      security:
        - bearerAuth: []
  /api/public/sites/info:
    get:
      tags:
        - Sites
      summary: Get public site information
      description: Retrieves public information from the Moodle site without authentication.
      operationId: getPublicSiteInfo
      parameters:
        - name: host
          in: query
          description: Moodle site URL.
          required: true
          schema:
            type: string
            format: uri
      responses:
        "200":
          description: Site information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicSiteInfoResponseDto"
      security:
        - bearerAuth: []
  /api/enrollments/info:
    get:
      tags:
        - UserEnrollments
      summary: Get the current user's enrollments
      description: Retrieves the current user's course enrollments from the local
        tenant database.
      operationId: getActualUserEnrollments
      responses:
        "200":
          description: Successful retrieval of enrollments. The response includes
            the updated enrollment information for the user's courses.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentsResponseDto"
        "401":
          description: Unauthorized - token missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []
  /api/courses/{courseId}/grades/values:
    get:
      tags:
        - CourseGrades
      summary: Get course grade values
      description: Get course grade values
      operationId: getCourseGradesValues
      parameters:
        - name: courseId
          in: path
          description: Course identifier
          required: true
          schema:
            type: integer
            format: int64
        - name: gradeItemsIds
          in: query
          description: List of grade item identifiers to include in the grade value
            lookup.
          required: true
          schema:
            type: array
            items:
              type: integer
              format: int64
            maxItems: 2147483647
            minItems: 0
        - name: userIds
          in: query
          description: "List of user IDs to filter the results. If provided, only the\
            \ specified users will have their grades included in the response."
          required: true
          schema:
            type: array
            items:
              type: integer
              format: int64
            maxItems: 2147483647
            minItems: 0
      responses:
        "200":
          description: Grades retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseGradesValuesResponseDto"
        "401":
          description: Unauthorized - token missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []
  /api/courses/{courseId}/grades/info:
    get:
      tags:
        - CourseGrades
      summary: Get course grades
      description: "Retrieves the grade information for users enrolled in a specific\
        \ course. This endpoint provides details about the users enrolled in the course,\
        \ including their roles and grade status. It allows clients to access up-to-date\
        \ grade information for a particular course on the Moodle site."
      operationId: getCourseGradesInfo
      parameters:
        - name: courseId
          in: path
          description: The unique identifier of the course for which to retrieve grades.
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Successful retrieval of grades. The response includes the grade
            information for users grades in the specified course.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseGradeItemsResponseDto"
        "401":
          description: Unauthorized - token missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []
  /api/courses/{courseId}/enrollments/info:
    get:
      tags:
        - CourseEnrollments
      summary: Get course enrollments
      description: "Retrieves the enrollment information for users enrolled in a specific\
        \ course. This endpoint provides details about the users enrolled in the course,\
        \ including their roles and enrollment status. It allows clients to access\
        \ up-to-date enrollment information for a particular course on the Moodle\
        \ site."
      operationId: getCourseUsersEnrollmentsInfo
      parameters:
        - name: courseId
          in: path
          description: The unique identifier of the course for which to retrieve enrollments.
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Successful retrieval of enrollments. The response includes
            the enrollment information for users enrolled in the specified course.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseEnrollmentsResponseDto"
        "401":
          description: Unauthorized - token missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []
  /api/courses/{courseId}/content/info:
    get:
      tags:
        - CourseContent
      summary: Get course content
      description: Retrieves the sections and modules stored for a course.
      operationId: getCourseUsersContentInfo
      parameters:
        - name: courseId
          in: path
          description: The unique identifier of the course for which to retrieve contents.
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Get course sections and modules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseContentResponseDto"
        "401":
          description: Unauthorized - token missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []
  /api/courses/{courseId}/activitycompletion/values:
    get:
      tags:
        - CourseActivityCompletion
      summary: Get course activity completion information with filter
      description: Retrieves the activity completion information for a course.
      operationId: getCourseActivityCompletionValues
      parameters:
        - name: courseId
          in: path
          description: The unique identifier of the course for which to retrieve activity
            completion information.
          required: true
          schema:
            type: integer
            format: int64
        - name: moduleIds
          in: query
          description: Course modules ids.
          required: true
          schema:
            type: array
            items:
              type: integer
              format: int64
            maxItems: 2147483647
            minItems: 0
        - name: userIds
          in: query
          description: Course user ids.
          required: true
          schema:
            type: array
            items:
              type: integer
              format: int64
            maxItems: 2147483647
            minItems: 0
      responses:
        "200":
          description: Get course activity completion information
