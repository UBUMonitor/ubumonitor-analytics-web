      operationId: getCourseActivityCompletionValues
      parameters:
        - name: courseId
          in: path
          description: Course identifier
          required: true
          schema:
            type: integer
            format: int64
        - name: moduleIds
          in: query
          description: Course modules ids.
          required: true
          schema:
            maxItems: 2147483647
            minItems: 0
            type: array
            items:
              type: integer
              format: int64
        - name: userIds
          in: query
          description: Course user ids.
          required: true
          schema:
            maxItems: 2147483647
            minItems: 0
            type: array
            items:
              type: integer
              format: int64
      responses:
