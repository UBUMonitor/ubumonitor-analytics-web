          format: int64
        categoryId:
          type: integer
          description: "Moodle category identifier containing this grade item, if\
            \ applicable"
          format: int64
        parentCategoryId:
          type: integer
          description: "Moodle parent category identifier for this category grade\
            \ item, if applicable"
          format: int64
        moduleId:
          type: integer
          description: "Moodle course module identifier for the grade item, if applicable"
          format: int64
        position:
          type: integer
          description: 0-based position of the grade item in Moodle's gradeitems array
          format: int32
        name:
          type: string
          description: Name of the grade item
        gradeMin:
          type: number
          description: Minimum grade value for the grade item
          format: double
        gradeMax:
          type: number
          description: Maximum grade value for the grade item
          format: double
    CourseForumsResponseDto:
      required:
        - forums
      type: object
      properties:
        forums:
          type: array
          description: "Forums, their discussions, and posts in the requested course."
          items:
            $ref: "#/components/schemas/ForumDto"
    ForumDiscussionDto:
      required:
        - forumId
        - id
        - locked
        - pinned
      type: object
      properties:
        id:
          type: integer
          description: "Discussion ID (Moodle \"discussion\" field, not \"id\", which\
            \ is the first post id)"
          format: int64
        forumId:
          type: integer
          description: ID of the forum the discussion belongs to
          format: int64
        name:
          type: string
          description: Discussion name
        groupId:
          type: integer
          description: Group ID
          format: int64
        userId:
          type: integer
          description: ID of the user who started the discussion (author)
          format: int64
        timeStart:
          type: integer
          description: Display start time as a Unix timestamp (null = always displayed)
          format: int64
        timeEnd:
          type: integer
          description: Display end time as a Unix timestamp (null = never ends)
          format: int64
        timeModified:
          type: integer
          description: Last modification time as a Unix timestamp
          format: int64
        pinned:
          type: boolean
          description: Whether the discussion is pinned to the top of the list
        locked:
          type: boolean
          description: Whether the discussion is locked (no more replies allowed)
        posts:
          type: array
          description: Posts of the discussion
          items:
            $ref: "#/components/schemas/ForumPostDto"
      description: Discussions of the forum
    ForumDto:
      required:
        - courseId
        - id
        - moduleId
        - visible
      type: object
      properties:
        id:
          type: integer
          description: Forum ID
          format: int64
        courseId:
          type: integer
          description: ID of the course the forum belongs to
          format: int64
        moduleId:
          type: integer
          description: "Course module ID (cmid / coursemodule -> MODULES.ID, no FK)"
          format: int64
        name:
          type: string
          description: Forum name
        intro:
          type: string
          description: Forum introduction text
        type:
          type: string
          description: Forum type
          enum:
            - GENERAL
            - NEWS
            - QANDA
            - EACHUSER
            - SINGLE
            - BLOG
        visible:
          type: boolean
          description: Whether the forum is visible to students
        groupMode:
          type: string
          description: Group mode
          enum:
            - NO_GROUPS
            - SEPARATE_GROUPS
            - VISIBLE_GROUPS
        groupingId:
          type: integer
          description: Grouping ID used for the forum
          format: int64
        dueDate:
          type: integer
          description: Due date as a Unix timestamp (null = no due date)
          format: int64
        cutoffDate:
          type: integer
          description: Cut-off date as a Unix timestamp; no posts are accepted after
            it (null = no cut-off)
          format: int64
        assessed:
          type: string
          description: Aggregate type used to assess posts (null = no ratings)
          enum:
            - AVERAGE
            - COUNT
            - MAX
            - MIN
            - SUM
        scale:
          type: integer
          description: Grade type or scale ID used for ratings (negative values refer
            to a scale ID)
          format: int32
        gradeForum:
          type: integer
          description: Maximum grade for the whole forum (null = forum is not graded)
          format: int32
        maxBytes:
          type: integer
          description: Maximum attachment size in bytes
          format: int64
        maxAttachments:
          type: integer
          description: Maximum number of attachments per post
          format: int32
        forceSubscribe:
          type: string
          description: Subscription mode
          enum:
            - OPTIONAL
            - FORCED
            - AUTO
            - DISABLED
        trackingType:
          type: string
          description: Read tracking type
          enum:
            - "OFF"
            - OPTIONAL
            - FORCED
        warnAfter:
          type: integer
          description: Number of posts in the blocking period after which the user
            is warned
          format: int64
        blockAfter:
          type: integer
          description: Number of posts in the blocking period after which the user
            is blocked from posting
          format: int64
        blockPeriod:
          type: integer
          description: Blocking period in seconds
          format: int64
        lockDiscussionAfter:
          type: integer
          description: Seconds of inactivity after which discussions are automatically
            locked (null = never)
          format: int64
        completionDiscussions:
          type: integer
          description: Number of discussions a student must create to complete the
            activity
          format: int32
        completionReplies:
          type: integer
          description: Number of replies a student must post to complete the activity
          format: int32
        completionPosts:
          type: integer
          description: Total number of posts a student must make to complete the activity
          format: int32
        timeModified:
          type: integer
          description: Last modification time as a Unix timestamp
          format: int64
        discussions:
          type: array
          description: Discussions of the forum
          items:
            $ref: "#/components/schemas/ForumDiscussionDto"
      description: "Forums, their discussions, and posts in the requested course."
    ForumPostDto:
      required:
        - discussionId
        - hasAttachment
        - id
        - isDeleted
        - isPrivateReply
      type: object
      properties:
        id:
          type: integer
          description: Post ID
          format: int64
        discussionId:
          type: integer
          description: ID of the discussion the post belongs to
          format: int64
        parentId:
          type: integer
          description: ID of the parent post (null = first post of the discussion)
          format: int64
        userId:
          type: integer
          description: ID of the post author
          format: int64
        subject:
          type: string
          description: Post subject
        message:
          type: string
          description: Post message body
        hasAttachment:
          type: boolean
          description: Whether the post has attachments
        isDeleted:
          type: boolean
          description: Whether the post has been deleted
        isPrivateReply:
          type: boolean
          description: Whether the post is a private reply
        timeCreated:
          type: integer
          description: Creation time as a Unix timestamp
          format: int64
        timeModified:
          type: integer
          description: Last modification time as a Unix timestamp
          format: int64
      description: Posts of the discussion
