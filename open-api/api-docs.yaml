                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []
  /api/courses/{courseId}/forums/info:
    get:
      tags:
        - CourseForums
      summary: Get course forums information
      description: "Retrieves the persisted forums, discussions, and posts for the\
        \ specified course."
      operationId: getCourseForums
      parameters:
        - name: courseId
          in: path
          description: Course identifier
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Successful retrieval of forum information. The response includes
            the forum information for the specified course.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseForumsResponseDto"
        "401":
          description: Unauthorized - token missing or invalid
